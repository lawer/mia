<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" role="img" aria-labelledby="title desc"><title id="title">Matriu de confusió</title><desc id="desc">Files: realitat segons revisió. Columnes: predicció. VP i VN són encerts; FN i FP són errors.</desc><rect width="1100" height="440" fill="#fff"/><g font-family="DejaVu Sans,Arial,sans-serif" fill="#17364b"><text x="680" y="35" font-size="22" fill="#17364b" text-anchor="middle" font-weight="bold">PREDICCIÓ DEL MODEL</text><text x="440" y="75" font-size="25" fill="#17364b" text-anchor="middle" font-weight="normal">Urgent</text><text x="830" y="75" font-size="25" fill="#17364b" text-anchor="middle" font-weight="normal">No urgent</text><text x="20" y="180" font-size="19" fill="#17364b" text-anchor="start" font-weight="bold">REVISIÓ</text><text x="20" y="212" font-size="23" fill="#17364b" text-anchor="start" font-weight="normal">Urgent</text><text x="20" y="352" font-size="23" fill="#17364b" text-anchor="start" font-weight="normal">No urgent</text><rect x="245" y="105" width="365" height="140" rx="15" fill="#d5ece9"/><text x="427" y="143" font-size="30" fill="#17364b" text-anchor="middle" font-weight="bold">VP</text><text x="427" y="183" font-size="21" fill="#17364b" text-anchor="middle" font-weight="normal">Urgent detectada</text><text x="427" y="216" font-size="18" fill="#17364b" text-anchor="middle" font-weight="normal">Prioritat correcta</text><rect x="635" y="105" width="365" height="140" rx="15" fill="#f8e3de"/><text x="817" y="143" font-size="30" fill="#17364b" text-anchor="middle" font-weight="bold">FN</text><text x="817" y="183" font-size="21" fill="#17364b" text-anchor="middle" font-weight="normal">Urgent no detectada</text><text x="817" y="216" font-size="18" fill="#17364b" text-anchor="middle" font-weight="normal">Risc de retard</text><rect x="245" y="265" width="365" height="140" rx="15" fill="#fff0cc"/><text x="427" y="303" font-size="30" fill="#17364b" text-anchor="middle" font-weight="bold">FP</text><text x="427" y="343" font-size="21" fill="#17364b" text-anchor="middle" font-weight="normal">Alerta innecessària</text><text x="427" y="376" font-size="18" fill="#17364b" text-anchor="middle" font-weight="normal">Desplaça altres casos</text><rect x="635" y="265" width="365" height="140" rx="15" fill="#d5ece9"/><text x="817" y="303" font-size="30" fill="#17364b" text-anchor="middle" font-weight="bold">VN</text><text x="817" y="343" font-size="21" fill="#17364b" text-anchor="middle" font-weight="normal">No urgent ben identificada</text><text x="817" y="376" font-size="18" fill="#17364b" text-anchor="middle" font-weight="normal">Cua ordinària</text></g></svg>
