<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="370" viewBox="0 0 1100 370" role="img" aria-labelledby="title desc"><title id="title">Cicle de treball responsable</title><desc id="desc">Definir, identificar, provar, supervisar i revisar; repetir el cicle després dels canvis.</desc><rect width="1100" height="370" fill="#fff"/><g font-family="DejaVu Sans,Arial,sans-serif" fill="#17364b"><rect x="15" y="85" width="195" height="150" rx="15" fill="#e7f1f1"/><text x="112" y="123" font-size="27" fill="#187f86" text-anchor="middle" font-weight="bold">1</text><text x="112" y="161" font-size="25" fill="#17364b" text-anchor="middle" font-weight="bold">Definir</text><text x="112" y="198" font-size="17" fill="#17364b" text-anchor="middle" font-weight="normal">Propòsit i límits</text><text x="219" y="168" font-size="25" fill="#187f86" text-anchor="middle" font-weight="normal">→</text><rect x="233" y="85" width="195" height="150" rx="15" fill="#e7f1f1"/><text x="330" y="123" font-size="27" fill="#187f86" text-anchor="middle" font-weight="bold">2</text><text x="330" y="161" font-size="25" fill="#17364b" text-anchor="middle" font-weight="bold">Identificar</text><text x="330" y="198" font-size="17" fill="#17364b" text-anchor="middle" font-weight="normal">Persones i riscos</text><text x="437" y="168" font-size="25" fill="#187f86" text-anchor="middle" font-weight="normal">→</text><rect x="451" y="85" width="195" height="150" rx="15" fill="#e7f1f1"/><text x="548" y="123" font-size="27" fill="#187f86" text-anchor="middle" font-weight="bold">3</text><text x="548" y="161" font-size="25" fill="#17364b" text-anchor="middle" font-weight="bold">Provar</text><text x="548" y="198" font-size="17" fill="#17364b" text-anchor="middle" font-weight="normal">Errors i controls</text><text x="655" y="168" font-size="25" fill="#187f86" text-anchor="middle" font-weight="normal">→</text><rect x="669" y="85" width="195" height="150" rx="15" fill="#e7f1f1"/><text x="766" y="123" font-size="27" fill="#187f86" text-anchor="middle" font-weight="bold">4</text><text x="766" y="161" font-size="25" fill="#17364b" text-anchor="middle" font-weight="bold">Supervisar</text><text x="766" y="198" font-size="17" fill="#17364b" text-anchor="middle" font-weight="normal">Revisió i resposta</text><text x="873" y="168" font-size="25" fill="#187f86" text-anchor="middle" font-weight="normal">→</text><rect x="887" y="85" width="195" height="150" rx="15" fill="#e7f1f1"/><text x="984" y="123" font-size="27" fill="#187f86" text-anchor="middle" font-weight="bold">5</text><text x="984" y="161" font-size="25" fill="#17364b" text-anchor="middle" font-weight="bold">Revisar</text><text x="984" y="198" font-size="17" fill="#17364b" text-anchor="middle" font-weight="normal">Canvis i incidents</text><path d="M985 253 V295 H115 V253" fill="none" stroke="#187f86" stroke-width="4"/><text x="115" y="260" font-size="28" fill="#187f86" text-anchor="middle" font-weight="normal">↑</text><text x="550" y="344" font-size="23" fill="#17364b" text-anchor="middle" font-weight="normal">Tornar a provar quan canvia el sistema o el context</text></g></svg>
