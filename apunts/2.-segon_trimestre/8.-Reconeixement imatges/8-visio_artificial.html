<h4 id="usos">Usos</h4>
<ul>
<li><strong>Seguretat</strong>: construir sistemes de seguretat més efectius i menys intrusius.</li>
<li><strong>Urbanisme</strong>: entendre com es mouen les persones per tal de dissenyar millor les ciutats.</li>
<li><strong>Esports</strong>: analitzar videos de partits per tal de millorar l'entrenament i extreure estadístiques.</li>
<li><strong>Estalvi energètic</strong>: engegar i parar sistemes de climatització i llum en funció de la presència de persones.</li>
</ul>
<p>Molts més, en videojocs, en la indústria, en la medicina, etc.</p>
<footer>🄯 Carles Gonzàlez - CC-BY-NC-SA</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="63" style="--class:default;--paginate:true;--footer:🄯 Carles Gonzàlez - CC-BY-NC-SA;--theme:lawer;--marpit-advanced-background-split:30%;" data-marpit-pagination-total="98" data-size="16:9" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;../../images/pose.png&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="70%" height="720"><section id="63" data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="63" style="--class:default;--paginate:true;--footer:🄯 Carles Gonzàlez - CC-BY-NC-SA;--theme:lawer;--marpit-advanced-background-split:30%;" data-marpit-pagination-total="98" data-size="16:9" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h4 id="detecci%C3%B3-de-la-postura">Detecció de la postura</h4>
<ul>
<li>Alguns aspectes com la <strong>detecció de la postura</strong> (determinar la posició de les articulacions) estan molt avançats.</li>
<li>Es relativament fàcil, ja que les articulacions tenen una forma i una posició concreta, les relacions entre les articulacions són conegudes i els efectes sobre las perspectiva són previsibles.</li>
<li>Per contra, preveure el que està fent una persona és molt més difícil.</li>
</ul>
<footer>🄯 Carles Gonzàlez - CC-BY-NC-SA</footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="63" style="" data-marpit-pagination-total="98" data-size="16:9" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="64" style="--class:default;--paginate:true;--footer:🄯 Carles Gonzàlez - CC-BY-NC-SA;--theme:lawer;" data-marpit-pagination-total="98" data-size="16:9">
<h4 id="descripci%C3%B3-de-lacci%C3%B3">Descripció de l'acció</h4>
<ul>
<li>La <strong>descripció de l'acció</strong> és una tasca molt més complexa.</li>
<li>Consisteix en <strong>entendre</strong> què està fent una persona en una imatge.</li>
<li>Moltes vegades és necessari <strong>entendre el context</strong> per tal de saber què està fent una persona.</li>
<li>Aquesta dependència del context fa difícil assegurar el correcte funcionament dels sistemes.
<ul>
<li>Ex: en una piscina es fàcil dir que algú està nedant. Ho ha sabut descriure o simplement ha detectat una piscina?</li>
</ul>
</li>
</ul>
<footer>🄯 Carles Gonzàlez - CC-BY-NC-SA</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="65" style="--class:default;--paginate:true;--footer:🄯 Carles Gonzàlez - CC-BY-NC-SA;--theme:lawer;" data-marpit-pagination-total="98" data-size="16:9">
<h3 id="creaci%C3%B3-dimatges">Creació d'imatges</h3>
<ul>
<li>Les xarxes neuronals són capaces de <strong>crear imatges</strong> a partir de text o d'altres imatges.</li>
<li>Un dels usos està relacionat amb el <em>self-supervised learning</em>.
<ul>
<li>Quan no tenim moltes dades etiquetades, podem utilitzar xarxes per tal de crear més dades.</li>
<li>Aquestes dades poden ser utilitzades per tal de millorar el rendiment de les xarxes.</li>
<li>Veurem com es fa a continuació.</li>
</ul>
</li>
</ul>
<footer>🄯 Carles Gonzàlez - CC-BY-NC-SA</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-marpit-scope-lY7EKojQ="" data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="66" style="--class:default;--paginate:true;--footer:🄯 Carles Gonzàlez - CC-BY-NC-SA;--theme:lawer;" data-marpit-pagination-total="98" data-size="16:9">
<h4 id="autoencoder">Autoencoder</h4>
<ul>
<li>Un <strong>autoencoder</strong> és una arquitectura de xarxa neuronal que es fa servir per tal de <strong>reconstruir</strong> la imatge d'entrada; moltes vegades, però, amb modificacions.</li>
<li>L'autoencoder té tres parts:
<ul>
<li><strong>Encoder</strong>: pren la imatge d'entrada i la converteix en un <strong>vector de característiques</strong>.</li>
<li><strong>Bottleneck</strong>: el vector de característiques. És la part més important de l'autoencoder.</li>
<li><strong>Decoder</strong>: pren el vector de característiques i el converteix en la imatge d'entrada.</li>
</ul>
</li>
</ul>
<footer>🄯 Carles Gonzàlez - CC-BY-NC-SA</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="67" style="--class:default;--paginate:true;--footer:🄯 Carles Gonzàlez - CC-BY-NC-SA;--theme:lawer;" data-marpit-pagination-total="98" data-size="16:9" data-marpit-advanced-background="background"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;../../images/autoencoder.png&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="1280" height="720"><section id="67" data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="67" style="--class:default;--paginate:true;--footer:🄯 Carles Gonzàlez - CC-BY-NC-SA;--theme:lawer;" data-marpit-pagination-total="98" data-size="16:9" data-marpit-advanced-background="content"><footer>🄯 Carles Gonzàlez - CC-BY-NC-SA</footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="67" style="" data-marpit-pagination-total="98" data-size="16:9" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="68" style="--class:default;--paginate:true;--footer:🄯 Carles Gonzàlez - CC-BY-NC-SA;--theme:lawer;" data-marpit-pagination-total="98" data-size="16:9">
<h4 id="utilitats-de-lautoencoder">Utilitats de l'autoencoder</h4>
<ul>
<li><strong>Reducció de la dimensió</strong>: l'autoencoder pot ser utilitzat per tal de reduir la dimensió de la imatge.</li>
<li><strong>Denioising</strong>: al generar el vector de característiques, guardem la informació més important de la imatge, eliminant el soroll.</li>
<li><strong>Super-resolució</strong>: partim d'una imatge de baixa resolució i la convertim en una imatge de alta resolució.</li>
<li><strong>Creació d'imatges</strong>: la part del decoder pot ser utilitzada per tal de crear imatges, partint de vectors de característiques aleatoris.</li>
</ul>
<footer>🄯 Carles Gonzàlez - CC-BY-NC-SA</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-marpit-scope-PA6g5Yj7="" data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="69" style="--class:default;--paginate:true;--footer:🄯 Carles Gonzàlez - CC-BY-NC-SA;--theme:lawer;--marpit-advanced-background-split:28%;" data-marpit-pagination-total="98" data-size="16:9" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;../../images/vae.jpg&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="72%" height="720"><section id="69" data-marpit-scope-PA6g5Yj7="" data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="69" style="--class:default;--paginate:true;--footer:🄯 Carles Gonzàlez - CC-BY-NC-SA;--theme:lawer;--marpit-advanced-background-split:28%;" data-marpit-pagination-total="98" data-size="16:9" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="autoencoders-variacionals">Autoencoders Variacionals</h3>
<ul>
<li>Els <strong>autoencoders variacionals</strong> són una variant dels autoencoders que permeten generar imatges.</li>
<li>El punt de partida és el mateix, però no generar un vector de característiques, sino una <strong>distribució de probabilitat</strong> que es fa servir per tal de generar imatges.</li>
<li>Generarem imatges amb un aspecte similar a les imatges d'entrada, però no iguals.</li>
</ul>
<footer>🄯 Carles Gonzàlez - CC-BY-NC-SA</footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-marpit-scope-PA6g5Yj7="" data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="69" style="" data-marpit-pagination-total="98" data-size="16:9" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-marpit-scope-NkNsQImV="" data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="70" style="--class:default;--paginate:true;--footer:🄯 Carles Gonzàlez - CC-BY-NC-SA;--theme:lawer;" data-marpit-pagination-total="98" data-size="16:9">
<h3 id="gans-generative-adversarial-networks">GANs (Generative Adversarial Networks)</h3>
<ul>
<li>Les <strong>GANs</strong> són un tipus de xarxes neuronals que es fan servir per tal de generar imatges.</li>
<li>Les GANs estan formades per dues xarxes:
<ul>
<li><strong>Generador</strong>: genera imatges a partir de vectors de característiques aleatoris.</li>
<li><strong>Discriminador</strong>: intenta distingir entre imatges reals i imatges generades.</li>
<li>Les dues xarxes es <strong>entrenen enfrontades</strong>. El generador intenta enganyar el discriminador i el discriminador intenta no ser enganyat.</li>
</ul>
</li>
</ul>
<footer>🄯 Carles Gonzàlez - CC-BY-NC-SA</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="71" style="--class:default;--paginate:true;--footer:🄯 Carles Gonzàlez - CC-BY-NC-SA;--theme:lawer;" data-marpit-pagination-total="98" data-size="16:9" data-marpit-advanced-background="background"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;../../images/GANS.png&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="1280" height="720"><section id="71" data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="71" style="--class:default;--paginate:true;--footer:🄯 Carles Gonzàlez - CC-BY-NC-SA;--theme:lawer;" data-marpit-pagination-total="98" data-size="16:9" data-marpit-advanced-background="content">
<h3 id="gans-generative-adversarial-networks-1">GANs (Generative Adversarial Networks)</h3>
<footer>🄯 Carles Gonzàlez - CC-BY-NC-SA</footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="71" style="" data-marpit-pagination-total="98" data-size="16:9" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-marpit-scope-vpnQ8UFq="" data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="72" style="--class:default;--paginate:true;--footer:🄯 Carles Gonzàlez - CC-BY-NC-SA;--theme:lawer;" data-marpit-pagination-total="98" data-size="16:9">
<h2 id="control-del-moviment">Control del moviment</h2>
<ul>
<li>Un dels usos més importants de la visió és el de manipular objectes (agafar-los, moure'ls, etc.) i navegar evitant obstacles. Els vehicles autònoms són un dels exemples més clars, i impliquen una sèrie de tasques:
<ul>
<li><strong>Control lateral</strong>: mantenir-se dins del carril.</li>
<li><strong>Control longitudinal</strong>: mantenir la distància de seguretat.</li>
<li><strong>Evitar obstacles</strong>: detectar i evitar possibles vehicles, vianants, etc.</li>
<li><strong>Respectar senyals</strong>: Incloent-hi les llums dels semàfors, guàrdies urbans, etc.</li>
</ul>
</li>
</ul>
<footer>🄯 Carles Gonzàlez - CC-BY-NC-SA</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="73" style="--class:default;--paginate:true;--footer:🄯 Carles Gonzàlez - CC-BY-NC-SA;--theme:lawer;" data-marpit-pagination-total="98" data-size="16:9">
<h3 id="procediment">Procediment</h3>
<ul>
<li>El Procediment bàsic consistirà en la generació d'una seqüència de comandes (acceleració, frenada, gir, etc.) que permetin al vehicle complir les tasques anteriorment esmentades.</li>
<li>Caldrà un model del mon i dels objectes que hi ha al voltant. Teòricament, aquest model es pot crear solament a partir de dades visió, però no és senzill. Ex: Captar la velocitat d'un vehicle a partir de la imatge és difícil.</li>
<li>En la pràctica, es fa servir una combinació de dades de visió i de sensors (radar, lidar, etc.).</li>
</ul>
<footer>🄯 Carles Gonzàlez - CC-BY-NC-SA</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="74" style="--class:default;--paginate:true;--footer:🄯 Carles Gonzàlez - CC-BY-NC-SA;--theme:lawer;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="98" data-size="16:9" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;../../images/mobileye.png&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="74" data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="74" style="--class:default;--paginate:true;--footer:🄯 Carles Gonzàlez - CC-BY-NC-SA;--theme:lawer;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="98" data-size="16:9" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="model-del-mon">Model del mon</h3>
<ul>
<li>El <strong>model del mon</strong> és una representació del mon que permet al vehicle preveure el que passarà en el futur.</li>
<li>Ex: en verd es mostra els llocs on el vehicle pot anar i els objectes es mostren envoltats per una caixa vermella.</li>
</ul>
<footer>🄯 Carles Gonzàlez - CC-BY-NC-SA</footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="74" style="" data-marpit-pagination-total="98" data-size="16:9" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="75" data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="75" style="--class:default;--paginate:true;--footer:🄯 Carles Gonzàlez - CC-BY-NC-SA;--theme:lawer;" data-marpit-pagination-total="98" data-size="16:9">
<h3 id="navegaci%C3%B3-aut%C3%B2noma">Navegació autònoma</h3>
<ul>
<li>La tasca de <strong>navegació autònoma</strong> consisteix en <strong>moure's</strong> per un entorn sense la <strong>intervenció humana</strong>.</li>
<li>Es sol dividir en dues tasques:
<ul>
<li><strong>Mapeig</strong>: crear un <strong>mapa</strong> de l'entorn. Algunes de les tècniques més comunes són el <strong>SLAM</strong> i el <strong>Simultaneous Localization and Mapping</strong>.</li>
<li><strong>Planiﬁcació de trajectòries</strong>: Una vegada el robot té un mapa 3D de l'entorn i sap on és, l'objectiu és <strong>planificar</strong> una <strong>trajectòria</strong> que el porti al seu destí sense col·lisions.</li>
</ul>
</li>
</ul>
<footer>🄯 Carles Gonzàlez - CC-BY-NC-SA</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="76" style="--class:default;--paginate:true;--footer:🄯 Carles Gonzàlez - CC-BY-NC-SA;--theme:lawer;" data-marpit-pagination-total="98" data-size="16:9" data-marpit-advanced-background="background"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;../../images/navegacio_autonoma.png&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="1280" height="720"><section id="76" data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="76" style="--class:default;--paginate:true;--footer:🄯 Carles Gonzàlez - CC-BY-NC-SA;--theme:lawer;" data-marpit-pagination-total="98" data-size="16:9" data-marpit-advanced-background="content">
<h3 id="mapeig-i-plani%EF%AC%81caci%C3%B3-de-traject%C3%B2ries">Mapeig i Planiﬁcació de trajectòries</h3>
<footer>🄯 Carles Gonzàlez - CC-BY-NC-SA</footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="76" style="" data-marpit-pagination-total="98" data-size="16:9" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="77" data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="77" style="--class:default;--paginate:true;--footer:🄯 Carles Gonzàlez - CC-BY-NC-SA;--theme:lawer;" data-marpit-pagination-total="98" data-size="16:9">
<h2 id="seguiment-dobjectes">Seguiment d'objectes</h2>
<ul>
<li>El <strong>seguiment d'objectes</strong> és una tasca de visió artificial que consisteix en <strong>seguir</strong> una <strong>sèrie d'objectes</strong> en una <strong>seqüència d'imatges</strong>.</li>
<li>La <strong>complexitat</strong> del seguiment s'origina de la quantitat d'imatges que poden haber en un video.
<ul>
<li>24 fps x 60 s x 60 min = <strong>86400 imatges en una hora</strong>.</li>
<li>Si contem 8 - 10 objectes = <strong>més de 800000 objectes</strong>.</li>
</ul>
</li>
<li>Aquesta tasca és molt important en aplicacions com la <strong>vigilància</strong>, <strong>robots autònoms</strong>,etc.</li>
</ul>
<footer>🄯 Carles Gonzàlez - CC-BY-NC-SA</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="78" data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="78" style="--class:default;--paginate:true;--footer:🄯 Carles Gonzàlez - CC-BY-NC-SA;--theme:lawer;" data-marpit-pagination-total="98" data-size="16:9">
<h3 id="tipus-de-seguiment">Tipus de seguiment</h3>
<ul>
<li>Tractarem els següents tipus de seguiment:
<ul>
<li><strong>Seguiment d'un sol objecte</strong> (single object tracking - SOT)</li>
<li><strong>Seguiment de múltiples objectes</strong> (multiple object tracking - MOT)</li>
<li><strong>Seguiment de múltiples objectes sense classe semi-supervisat</strong>. Versió estesa de SOT.</li>
<li><strong>Segmentació d'objectes en video</strong> (VOS).</li>
</ul>
</li>
<li>Els dos primers són els més comuns i son els que tractarem en més detall.</li>
</ul>
<footer>🄯 Carles Gonzàlez - CC-BY-NC-SA</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="79" data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="79" style="--class:default;--paginate:true;--footer:🄯 Carles Gonzàlez - CC-BY-NC-SA;--theme:lawer;" data-marpit-pagination-total="98" data-size="16:9">
<h4 id="seguiment-dun-sol-objecte">Seguiment d'un sol objecte</h4>
<ul>
<li>El <strong>seguiment d'un sol objecte</strong> consisteix en seguir un sol objecte en una seqüència d'<strong>imatges</strong>, basant-nos en una anotació manual inicial.</li>
<li>Al primer frame anotat l'anomenen <em>template</em> i a cadascún dels següents <em>search area</em></li>
<li>Les xarxes neuronals per aquestes tasques están entrenades per seguir qualsevol objecte del primer frame
<ul>
<li>S'anomenen <strong>X</strong>arxes <strong>N</strong>euronals <strong>A</strong>gnòstiques a la <strong>C</strong>lasse (Class Agnostic Neural Networks - CAN).</li>
</ul>
</li>
</ul>
<footer>🄯 Carles Gonzàlez - CC-BY-NC-SA</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="80" data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="80" style="--class:default;--paginate:true;--footer:🄯 Carles Gonzàlez - CC-BY-NC-SA;--theme:lawer;" data-marpit-pagination-total="98" data-size="16:9">
<h4 id="seguiment-de-m%C3%BAltiples-objectes---definici%C3%B3">Seguiment de múltiples objectes - Definició</h4>
<ul>
<li>El <strong>seguiment de múltiples objectes</strong> <strong>NO</strong> consisteix simplement en <strong>repetir SOT</strong> pero per a cada objecte.</li>
<li>En realitat consisteix en identificar i seguir tots els objectes d'una sèries de classes predefinides.
<ul>
<li>L'usuari no pot corregir al model ni aportar feedback.</li>
</ul>
</li>
<li>L'us més habitual és el d'<strong>aplicar el model a un video i després extreure estadístiques</strong>
<ul>
<li>Ex: quantes persones passen per un carrer en una hora.</li>
</ul>
</li>
<li>No es tant utilitzat per etiquetatge</li>
</ul>
<footer>🄯 Carles Gonzàlez - CC-BY-NC-SA</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="81" style="--class:default;--paginate:true;--footer:🄯 Carles Gonzàlez - CC-BY-NC-SA;--theme:lawer;" data-marpit-pagination-total="98" data-size="16:9" data-marpit-advanced-background="background"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;../../images/mot.gif&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="1280" height="720"><section id="81" data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="81" style="--class:default;--paginate:true;--footer:🄯 Carles Gonzàlez - CC-BY-NC-SA;--theme:lawer;" data-marpit-pagination-total="98" data-size="16:9" data-marpit-advanced-background="content"><footer>🄯 Carles Gonzàlez - CC-BY-NC-SA</footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="81" style="" data-marpit-pagination-total="98" data-size="16:9" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="82" data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="82" style="--class:default;--paginate:true;--footer:🄯 Carles Gonzàlez - CC-BY-NC-SA;--theme:lawer;" data-marpit-pagination-total="98" data-size="16:9">
<h4 id="seguiment-de-m%C3%BAltiples-objectes---funcionament">Seguiment de múltiples objectes - Funcionament</h4>
<ul>
<li>Dues fases, <strong>Detecció</strong> (identificar tots els objectes en una imatge) i <strong>Associació</strong> (associar els objectes detectats en una imatge amb els objectes detectats en la imatge anterior - <em>tracklets</em>).</li>
<li>Hi ha xarxes neuronals que poden fer les dues tasques alhora de forma eficient. Per entrenar-les, però, es fa servir un dataset de video etiquetat i son molt costosos de crear.</li>
<li>Es més freqüent fer servir una xarxa per la detecció, i una altra per la identificació i re-identificació: <strong>Tracking by detection</strong>. El rendiment, però, és més baix.</li>
</ul>
<footer>🄯 Carles Gonzàlez - CC-BY-NC-SA</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="83" style="--class:default;--paginate:true;--footer:🄯 Carles Gonzàlez - CC-BY-NC-SA;--theme:lawer;" data-marpit-pagination-total="98" data-size="16:9" data-marpit-advanced-background="background"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;../../images/tracking-by-detection.png&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="1280" height="720"><section id="83" data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="83" style="--class:default;--paginate:true;--footer:🄯 Carles Gonzàlez - CC-BY-NC-SA;--theme:lawer;" data-marpit-pagination-total="98" data-size="16:9" data-marpit-advanced-background="content">
<h5 id="tracking-by-detection">Tracking by detection</h5>
<footer>🄯 Carles Gonzàlez - CC-BY-NC-SA</footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="83" style="" data-marpit-pagination-total="98" data-size="16:9" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="84" data-marpit-scope-JSs4XQMM="" data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="84" style="--class:default;--paginate:true;--footer:🄯 Carles Gonzàlez - CC-BY-NC-SA;--theme:lawer;" data-marpit-pagination-total="98" data-size="16:9">
<h5 id="identificaci%C3%B3-i-re-identificaci%C3%B3">Identificació i re-identificació</h5>
<ul>
<li>La <strong>identificació</strong> és la tasca d'assignar un <strong>identificador únic</strong> a cada objecte detectat.</li>
<li>La <strong>re-identificació</strong> és la tasca d'associar el <strong>mateix identificador</strong> a un objecte detectat en diferents imatges.
<ul>
<li>Aquesta es la tasca més difícil, ja que els objectes poden canviar molt en aparença. Ex: una persona que es tapa la cara.</li>
</ul>
</li>
<li>Alguns dels algorismes més comuns són:
<ul>
<li><strong>ByteTrack</strong>: algorisme simple i ràpid.</li>
<li><strong>FairMOT</strong>: algorisme més complexe pero més precís.</li>
</ul>
</li>
</ul>
<footer>🄯 Carles Gonzàlez - CC-BY-NC-SA</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="85" data-marpit-scope-8gtTI9Kt="" data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="85" style="--class:default;--paginate:true;--footer:🄯 Carles Gonzàlez - CC-BY-NC-SA;--theme:lawer;" data-marpit-pagination-total="98" data-size="16:9">
<h2 id="reconeixement-facial">Reconeixement facial</h2>
<ul>
<li>El <strong>reconeixement facial</strong> és una tasca de visió artificial que consisteix en <strong>identificar</strong> una <strong>persona</strong> a partir d'una <strong>imatge</strong> o un <strong>video</strong>.</li>
<li>Aquesta tasca és molt important en aplicacions com la <strong>seguretat</strong>, <strong>control d'accés</strong>, <strong>vigilància</strong>, etc.</li>
<li>A pesar de que altres metodes com les <strong>empremtes digitals</strong> o l'<strong>iris</strong> són més segurs, el <strong>reconeixement facial</strong> és més <strong>còmode</strong> i <strong>menys intrusiu</strong>.</li>
<li>Això ha fet que s'hagi mantingut la investigació en aquesta àrea, i que s'hagi aconseguit un <strong>alt rendiment</strong>.</li>
</ul>
<footer>🄯 Carles Gonzàlez - CC-BY-NC-SA</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="86" data-marpit-scope-FF7DixOt="" data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="86" style="--class:default;--paginate:true;--footer:🄯 Carles Gonzàlez - CC-BY-NC-SA;--theme:lawer;" data-marpit-pagination-total="98" data-size="16:9">
<h3 id="funcionament">Funcionament</h3>
<ul>
<li>El funcionament del <strong>reconeixement facial</strong> és molt similar al de la <strong>classificació d'imatges</strong>.</li>
<li>La <strong>diferència</strong> principal és que en lloc de classificar l'objecte que hi ha a la imatge, es classifica la <strong>persona</strong>.</li>
<li>Això fa que el <strong>reconeixement facial</strong> sigui una tasca més <strong>complexa</strong> que la <strong>classificació d'imatges</strong>, ja que les persones poden tenir moltes aparences diferents en funció de la <strong>llum</strong>, la <strong>posició</strong>, l'<strong>expressió</strong>, etc.</li>
<li>Les persones també poden <strong>canviar</strong> molt en el temps, per lo que haurem de buscar <strong>característiques invariants</strong>.</li>
</ul>
<footer>🄯 Carles Gonzàlez - CC-BY-NC-SA</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="87" data-marpit-scope-ZOYZCwt1="" data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="87" style="--class:default;--paginate:true;--footer:🄯 Carles Gonzàlez - CC-BY-NC-SA;--theme:lawer;" data-marpit-pagination-total="98" data-size="16:9">
<h4 id="enfocaments-per-al-reconeixement-facial">Enfocaments per al reconeixement facial</h4>
<ul>
<li><strong>Basats en la geometria</strong>: analitzen estadísticament la geometria de les <strong>característiques</strong> facials.</li>
<li><strong>Enfocament holístic</strong>: analitzen la <strong>imatge</strong> sencera i utilitzen les relacions entre les <strong>característiques</strong>.</li>
<li><strong>Basats en models</strong>: creen un vector de característiques a partir de la imatge i el comparen amb vectors de característiques predefinits.</li>
<li><strong>Basats en xarxes neuronals</strong>: utilitzen xarxes neuronals convolucionals per classificar la imatge; fins fa poc, però, no era factible per la gran quantitat de dades necessàries.</li>
</ul>
<footer>🄯 Carles Gonzàlez - CC-BY-NC-SA</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="88" data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="88" style="--class:default;--paginate:true;--footer:🄯 Carles Gonzàlez - CC-BY-NC-SA;--theme:lawer;" data-marpit-pagination-total="98" data-size="16:9">
<h1 id="models-avan%C3%A7ats-en-visi%C3%B3-artificial">Models avançats en visió artificial</h1>
<p>Transformers i Models de Difusió</p>
<footer>🄯 Carles Gonzàlez - CC-BY-NC-SA</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="89" data-marpit-scope-i9ZayVrS="" data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="89" style="--class:default;--paginate:true;--footer:🄯 Carles Gonzàlez - CC-BY-NC-SA;--theme:lawer;" data-marpit-pagination-total="98" data-size="16:9">
<h2 id="transformers-en-visi%C3%B3-artificial">Transformers en visió artificial</h2>
<ul>
<li>Els <strong>Transformers</strong>, originàriament dissenyats per a processament del llenguatge natural (NLP), s'han adaptat amb èxit a la visió artificial.</li>
<li><strong>ViT (Vision Transformers)</strong>: Un dels models més populars que aplica l'arquitectura Transformer a imatges.
<ul>
<li>Divideix la imatge en <strong>patxos</strong> (patches) i els tracta com a seqüències.</li>
<li>Utilitza <strong>atenció multi-cap</strong> (multi-head attention) per capturar relacions globals entre els patxos.</li>
</ul>
</li>
<li><strong>Aplicacions</strong>:
<ul>
<li>Classificació d'imatges.</li>
<li>Detecció d'objectes.</li>
<li>Segmentació semàntica.</li>
</ul>
</li>
</ul>
<footer>🄯 Carles Gonzàlez - CC-BY-NC-SA</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="90" data-marpit-scope-m41OZULh="" data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="90" style="--class:default;--paginate:true;--footer:🄯 Carles Gonzàlez - CC-BY-NC-SA;--theme:lawer;" data-marpit-pagination-total="98" data-size="16:9">
<h3 id="visi%C3%B3-per-transformers-vit">Visió per Transformers (ViT)</h3>
<ul>
<li><strong>Com funciona</strong>:
<ol>
<li>Divideix la imatge en petits patxos (ex: 16x16 píxels).</li>
<li>Aplana cada patx i el projecta a un espai latent mitjançant una capa lineal.</li>
<li>Afegeix embeddings de posició per mantenir la informació espacial.</li>
<li>Passa la seqüència de patxos per un Transformer encoder.</li>
</ol>
</li>
<li><strong>Avantatges</strong>:
<ul>
<li>Captura dependències a llarg termini entre regions de la imatge.</li>
<li>Escala millor amb dades a gran escala.</li>
</ul>
</li>
</ul>
<footer>🄯 Carles Gonzàlez - CC-BY-NC-SA</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="91" data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="91" style="--class:default;--paginate:true;--footer:🄯 Carles Gonzàlez - CC-BY-NC-SA;--theme:lawer;" data-marpit-pagination-total="98" data-size="16:9">
<h3 id="visi%C3%B3-per-transformers-vit-1">Visió per Transformers (ViT)</h3>
<footer>🄯 Carles Gonzàlez - CC-BY-NC-SA</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="92" data-marpit-scope-0a2dMK3G="" data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="92" style="--class:default;--paginate:true;--footer:🄯 Carles Gonzàlez - CC-BY-NC-SA;--theme:lawer;" data-marpit-pagination-total="98" data-size="16:9">
<h2 id="models-de-difusi%C3%B3">Models de Difusió</h2>
<ul>
<li>Els <strong>Models de Difusió</strong> són una família de models generatius que han demostrat un gran potencial en la generació d'imatges d'alta qualitat.</li>
<li><strong>Funcionament</strong>:
<ul>
<li>Es basen en un procés de <strong>difusió</strong> que afegeix soroll a les dades (imatges) durant múltiples passos.</li>
<li>Després, el model aprèn a revertir aquest procés per generar imatges a partir de soroll.</li>
</ul>
</li>
<li><strong>Exemples populars</strong>:
<ul>
<li><strong>DALL-E</strong>: Genera imatges a partir de descripcions textuals.</li>
<li><strong>Stable Diffusion</strong>: Un model eficient que genera imatges d'alta qualitat amb menys recursos computacionals.</li>
</ul>
</li>
</ul>
<footer>🄯 Carles Gonzàlez - CC-BY-NC-SA</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="93" data-marpit-scope-lCE51cQS="" data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="93" style="--class:default;--paginate:true;--footer:🄯 Carles Gonzàlez - CC-BY-NC-SA;--theme:lawer;" data-marpit-pagination-total="98" data-size="16:9">
<h3 id="proc%C3%A9s-de-difusi%C3%B3">Procés de Difusió</h3>
<ol>
<li><strong>Forward process</strong>:
<ul>
<li>Afegeix soroll gaussià a la imatge en passos incrementals.</li>
<li>La imatge es converteix en soroll pur després de múltiples passos.</li>
</ul>
</li>
<li><strong>Reverse process</strong>:
<ul>
<li>El model aprèn a eliminar el soroll pas a pas per reconstruir la imatge original.</li>
</ul>
</li>
<li><strong>Generació</strong>:
<ul>
<li>Es comença amb soroll pur i s'aplica el procés invers per generar noves imatges.</li>
</ul>
</li>
</ol>
<footer>🄯 Carles Gonzàlez - CC-BY-NC-SA</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="94" style="--class:default;--paginate:true;--footer:🄯 Carles Gonzàlez - CC-BY-NC-SA;--theme:lawer;" data-marpit-pagination-total="98" data-size="16:9" data-marpit-advanced-background="background"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;../../images/diffu.png&quot;);background-size:60%;"></figure></div></section></foreignObject><foreignObject width="1280" height="720"><section id="94" data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="94" style="--class:default;--paginate:true;--footer:🄯 Carles Gonzàlez - CC-BY-NC-SA;--theme:lawer;" data-marpit-pagination-total="98" data-size="16:9" data-marpit-advanced-background="content">

<h3 id="aplicacions-dels-models-de-difusi%C3%B3">Aplicacions dels Models de Difusió</h3>
<ul>
<li><strong>Generació d'imatges</strong>:
<ul>
<li>Crear imatges realistes a partir de descripcions textuals.</li>
<li>Ex: &quot;Un gos assegut en un camp amb un cel blau&quot;.</li>
</ul>
</li>
<li><strong>Edició d'imatges</strong>:
<ul>
<li>Modificar imatges existents afegint o eliminant objectes.</li>
</ul>
</li>
<li><strong>Super-resolució</strong>:
<ul>
<li>Millorar la resolució d'imatges de baixa qualitat.</li>
</ul>
</li>
<li><strong>Art generatiu</strong>:
<ul>
<li>Crear obres d'art úniques mitjançant la combinació d'estils i conceptes.</li>
</ul>
</li>
</ul>
<footer>🄯 Carles Gonzàlez - CC-BY-NC-SA</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="96" data-marpit-scope-Ybk4iqn6="" data-class="default" data-paginate="true" data-footer="🄯 Carles Gonzàlez - CC-BY-NC-SA" data-theme="lawer" lang="es-ES" class="default" data-marpit-pagination="96" style="--class:default;--paginate:true;--footer:🄯 Carles Gonzàlez - CC-BY-NC-SA;--theme:lawer;" data-marpit-pagination-total="98" data-size="16:9">
<h2 id="comparativa-entre-transformers-i-models-de-difusi%C3%B3">Comparativa entre Transformers i Models de Difusió</h2>
<table>
<thead>
<tr>
<th><strong>Característica</strong></th>
<th><strong>Transformers</strong></th>
<th><strong>Models de Difusió</strong></th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Enfocament</strong></td>
<td>Atenció global i seqüencial.</td>
<td>Procés iteratiu de soroll.</td>
</tr>
<tr>
<td><strong>Aplicacions principals</strong></td>
<td>Classificació, detecció.</td>
<td>Generació i edició d'imatges.</td>
</tr>
<tr>
<td><strong>Complexitat</strong></td>
<td>Alta (requereix molts recursos).</td>
<td>Moderada (més eficient).</td>
</tr>
<tr>
<td><strong>Escalabilitat</strong></td>
<td>Excel·lent amb dades grans.</td>
<td>Bona, però menys que ViT.</td>
</tr>
</tbody>
</table>
<footer>🄯 Carles Gonzàlez - CC-BY-NC-SA</footer>
</section>
